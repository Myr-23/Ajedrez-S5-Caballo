<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Ajedrez: El Caballo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #fff4e0;
    --bg-2: #ffe0ec;
    --text-main: #33244a;
    --text-soft: #5c4a75;
    --card-bg: rgba(255,255,255,0.88);
    --shadow: rgba(80, 40, 90, 0.22);
    --accent-gold: #f6b93b;
    --accent-red: #e74c3c;
    --accent-blue: #4a6fdc;
    --accent-purple: #8e5fd6;
    --accent-green: #27ae60;
    --dot-inactive: rgba(90,60,110,0.25);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-1: #221933;
      --bg-2: #2e1f45;
      --text-main: #f5eefe;
      --text-soft: #d8c9f0;
      --card-bg: rgba(40, 28, 60, 0.85);
      --shadow: rgba(0,0,0,0.45);
      --dot-inactive: rgba(255,255,255,0.2);
    }
  }
  :root[data-theme="dark"] {
    --bg-1: #221933;
    --bg-2: #2e1f45;
    --text-main: #f5eefe;
    --text-soft: #d8c9f0;
    --card-bg: rgba(40, 28, 60, 0.85);
    --shadow: rgba(0,0,0,0.45);
    --dot-inactive: rgba(255,255,255,0.2);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Fredoka', 'Baloo 2', system-ui, sans-serif;
    background: var(--bg-1);
    color: var(--text-main);
    overflow-x: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .stage {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px 12px;
    overflow: hidden;
  }

  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    opacity: 0;
    transform: translateX(40px) scale(0.98);
    pointer-events: none;
    transition: opacity 0.45s ease, transform 0.45s ease;
  }
  .slide.active {
    opacity: 1;
    transform: translateX(0) scale(1);
    pointer-events: auto;
  }
  .slide.leaving {
    transform: translateX(-40px) scale(0.98);
  }

  .slide-inner {
    width: 100%;
    max-width: 980px;
    max-height: 100%;
    display: flex;
    align-items: center;
    gap: clamp(16px, 4vw, 48px);
    background: var(--card-bg);
    border-radius: 28px;
    padding: clamp(18px, 3vw, 40px);
    box-shadow: 0 18px 50px var(--shadow);
    overflow: auto;
  }
  .slide-inner.stacked {
    flex-direction: column;
    text-align: center;
  }

  .art {
    flex: 0 0 auto;
    width: clamp(150px, 30vw, 260px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .art svg { width: 100%; height: auto; overflow: visible; }

  .cover-logo-strip {
    width: 100%;
    max-width: 900px;
    height: auto;
    margin: 4px auto 0;
    display: block;
    border-radius: 14px;
  }
  .cover-subtitle {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: clamp(14px, 2.2vw, 20px);
    color: var(--accent-purple);
    margin: 0 0 10px;
  }

  .content { flex: 1 1 auto; min-width: 0; }

  .eyebrow {
    display: inline-block;
    font-weight: 700;
    font-size: clamp(12px, 1.6vw, 15px);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 999px;
    color: white;
    margin-bottom: 10px;
  }

  h1 {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(26px, 5vw, 48px);
    line-height: 1.08;
    margin: 0 0 12px;
  }
  h2 {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: clamp(22px, 3.6vw, 34px);
    margin: 0 0 10px;
  }
  p.lead {
    font-size: clamp(15px, 2vw, 19px);
    color: var(--text-soft);
    line-height: 1.5;
    margin: 0 0 14px;
  }
  ul.facts {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  ul.facts li {
    font-size: clamp(14px, 1.8vw, 17px);
    line-height: 1.45;
    color: var(--text-main);
    background: rgba(0,0,0,0.035);
    border-left: 5px solid var(--fact-color, var(--accent-purple));
    padding: 8px 14px;
    border-radius: 10px;
  }
  strong.hl { color: var(--fact-color, var(--accent-purple)); }

  .badge-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 14px 0 0;
  }
  .badge {
    font-size: 13px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 999px;
    background: rgba(0,0,0,0.06);
    color: var(--text-soft);
  }


  /* Boards */
  .slide-inner.stacked ul.facts { text-align: left; max-width: 520px; }
  .board-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin: 6px 0 16px;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: min(80vw, 320px);
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 10px 26px rgba(0,0,0,0.22);
    border: 5px solid #8a5a2b;
  }
  .sq {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(15px, 4.2vw, 26px);
    line-height: 1;
    user-select: none;
  }
  .sq.light { background: #f0d9b5; }
  .sq.dark { background: #b58863; }
  .sq.reachable { cursor: pointer; }
  .sq.reachable::after {
    content: '';
    position: absolute;
    inset: 30%;
    border-radius: 50%;
    background: rgba(39,174,96,0.65);
    pointer-events: none;
  }
  .sq.capturable::after {
    content: '';
    position: absolute;
    inset: 6%;
    border-radius: 8px;
    border: 3px solid #e74c3c;
    background: rgba(231,76,60,0.12);
  }
  .sq .piece { position: relative; z-index: 2; }
  .sq .coord {
    position: absolute;
    bottom: 1px; left: 2px;
    font-size: 8px;
    font-weight: 700;
    opacity: 0.5;
  }
  .board-status {
    font-size: clamp(13px, 1.8vw, 15px);
    font-weight: 600;
    color: var(--text-soft);
    text-align: center;
    min-height: 20px;
  }
  .reset-btn {
    border: none;
    cursor: pointer;
    padding: 8px 20px;
    border-radius: 999px;
    background: var(--accent-purple);
    color: white;
    font-weight: 700;
    font-family: inherit;
    font-size: 14px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.2);
  }
  .reset-btn:active { transform: scale(0.95); }

  .nq-size-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    margin: 2px 0 12px;
  }
  .nq-size-btn {
    border: none;
    cursor: pointer;
    min-width: 34px; height: 34px;
    padding: 0 4px;
    border-radius: 10px;
    font-weight: 700;
    font-family: inherit;
    font-size: 13px;
    background: rgba(0,0,0,0.06);
    color: var(--text-soft);
    transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .nq-size-btn.active {
    background: var(--accent-purple);
    color: #fff;
    transform: scale(1.08);
  }
  .nq-size-btn:active { transform: scale(0.92); }
  .sq.nq-conflict { box-shadow: inset 0 0 0 3px #e74c3c; }

  /* Controls */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 10px 16px 22px;
  }
  .nav-btn {
    border: none;
    cursor: pointer;
    width: 48px; height: 48px;
    border-radius: 50%;
    background: var(--accent-purple);
    color: white;
    font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px rgba(0,0,0,0.2);
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .nav-btn:active { transform: scale(0.92); }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }

  .dots {
    display: flex;
    gap: 8px;
  }
  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--dot-inactive);
    cursor: pointer;
    border: none;
    padding: 0;
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .dot.active {
    background: var(--accent-purple);
    transform: scale(1.3);
  }

  .counter {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-soft);
    min-width: 46px;
    text-align: center;
  }

  @media (max-width: 640px) {
    .slide-inner { flex-direction: column; text-align: center; padding: 20px; }
    .art { width: clamp(130px, 45vw, 200px); }
    ul.facts li { text-align: left; }
  }
  /* ===== Sesiones 4 y 5: estilos extra ===== */
  .sq.clickable { cursor: pointer; }
  .sq.forbidden::after {
    content: '✕';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #e74c3c;
    font-weight: 700;
    font-size: clamp(14px, 3.6vw, 24px);
    pointer-events: none;
  }
  .sq.blockspot::after {
    content: '';
    position: absolute;
    inset: 22%;
    border-radius: 6px;
    border: 3px dashed #4a6fdc;
    pointer-events: none;
  }
  .sq.incheck { box-shadow: inset 0 0 0 4px #e74c3c; background-image: radial-gradient(circle, rgba(231,76,60,0.55) 0%, rgba(231,76,60,0) 75%); }
  .sq.attackline { background-image: linear-gradient(rgba(231,76,60,0.28), rgba(231,76,60,0.28)); }
  .sq.selected { box-shadow: inset 0 0 0 4px #f6b93b; }
  .sq.good { background-image: linear-gradient(rgba(39,174,96,0.55), rgba(39,174,96,0.55)); }
  .sq.bad { background-image: linear-gradient(rgba(231,76,60,0.55), rgba(231,76,60,0.55)); }
  .sq.target .piece { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }

  .choice-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin: 4px 0 6px;
  }
  .choice-btn {
    border: none;
    cursor: pointer;
    padding: 8px 18px;
    border-radius: 999px;
    font-weight: 700;
    font-family: inherit;
    font-size: 14px;
    color: #fff;
    box-shadow: 0 6px 16px rgba(0,0,0,0.18);
  }
  .choice-btn:active { transform: scale(0.95); }
  .choice-btn.yes { background: #c0392b; }
  .choice-btn.no { background: #27ae60; }
  .choice-btn.next { background: var(--accent-blue); }
  .choice-btn[disabled] { opacity: 0.4; cursor: default; }
  .escape-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .escape-chip {
    font-size: 14px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(0,0,0,0.06);
    color: var(--text-soft);
  }
  .escape-chip.done { background: #27ae60; color: #fff; }

  /* ===== Sesión 5: el caballo ===== */
  .sq .num {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: clamp(11px, 3vw, 19px);
    color: #2a1f3d;
    z-index: 3;
    pointer-events: none;
  }
  .sq .num.tour-step {
    inset: auto 2px 1px auto;
    font-size: 9px;
    display: block;
  }
  #nMoveBoard { position: relative; }
  .arrow-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 4;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.35));
  }
  .sq.visited { background-image: linear-gradient(rgba(74,111,220,0.38), rgba(74,111,220,0.38)); }
  .sq.trail { box-shadow: inset 0 0 0 3px rgba(142,95,214,0.75); }
  .sq.goal { box-shadow: inset 0 0 0 4px #f6b93b; }
  .sq.hint { box-shadow: inset 0 0 0 4px #f6b93b; animation: pulse 1.2s ease-in-out infinite; }
  .sq.forked { box-shadow: inset 0 0 0 4px #e74c3c; background-image: linear-gradient(rgba(231,76,60,0.25), rgba(231,76,60,0.25)); }
  .sq.heat2 { background-image: linear-gradient(rgba(192,57,43,0.55), rgba(192,57,43,0.55)); }
  .sq.heat3 { background-image: linear-gradient(rgba(230,126,34,0.5), rgba(230,126,34,0.5)); }
  .sq.heat4 { background-image: linear-gradient(rgba(241,196,15,0.5), rgba(241,196,15,0.5)); }
  .sq.heat6 { background-image: linear-gradient(rgba(46,204,113,0.45), rgba(46,204,113,0.45)); }
  .sq.heat8 { background-image: linear-gradient(rgba(22,135,106,0.6), rgba(22,135,106,0.6)); }
  .sq.dist1 { background-image: linear-gradient(rgba(22,135,106,0.6), rgba(22,135,106,0.6)); }
  .sq.dist2 { background-image: linear-gradient(rgba(46,204,113,0.45), rgba(46,204,113,0.45)); }
  .sq.dist3 { background-image: linear-gradient(rgba(241,196,15,0.5), rgba(241,196,15,0.5)); }
  .sq.dist4 { background-image: linear-gradient(rgba(230,126,34,0.5), rgba(230,126,34,0.5)); }
  .sq.dist5 { background-image: linear-gradient(rgba(192,57,43,0.5), rgba(192,57,43,0.5)); }
  .sq.dist6 { background-image: linear-gradient(rgba(142,68,173,0.55), rgba(142,68,173,0.55)); }
</style>
</head>
<body>

<div class="stage" id="stage"></div>

<div class="controls">
  <button class="nav-btn" id="prevBtn" aria-label="Anterior">&#8592;</button>
  <div class="dots" id="dots"></div>
  <button class="nav-btn" id="nextBtn" aria-label="Siguiente">&#8594;</button>
</div>
<div style="text-align:center; padding-bottom:14px;">
  <span class="counter" id="counter">1 / 17</span>
</div>

}

function buildStage() {
  stage.innerHTML = slides.map((s, i) => {
    return `<div class="slide" data-index="${i}" style="background:${s.grad}; border-radius:28px;">${renderSlideHTML(s)}</div>`;
  }).join('');
  buildDots();
  update(true);
}

function buildDots() {
  dotsEl.innerHTML = slides.map((_, i) => `<button class="dot" data-i="${i}" aria-label="Ir a diapositiva ${i+1}"></button>`).join('');
  dotsEl.querySelectorAll('.dot').forEach(d => {
    d.addEventListener('click', () => goTo(parseInt(d.dataset.i)));
  });
}

function update(first) {
  const slideEls = stage.querySelectorAll('.slide');
  slideEls.forEach((el, i) => {
    el.classList.toggle('active', i === current);
  });
  dotsEl.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === current));
  counterEl.textContent = `${current + 1} / ${slides.length}`;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === slides.length - 1;
}

function goTo(i) {
  if (i < 0 || i >= slides.length || i === current) return;
  current = i;
  update();
}

prevBtn.addEventListener('click', () => goTo(current - 1));
nextBtn.addEventListener('click', () => goTo(current + 1));
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') goTo(current + 1);
  if (e.key === 'ArrowLeft') goTo(current - 1);
});

let touchStartX = null;
stage.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; });
stage.addEventListener('touchend', (e) => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (dx > 50) goTo(current - 1);
  if (dx < -50) goTo(current + 1);
  touchStartX = null;
});

buildStage();

/* ===== Tablero: utilidades de coordenadas ===== */
const FILES = 'abcdefgh';
function toRC(sq) {
  return { row: 8 - parseInt(sq[1], 10), col: FILES.indexOf(sq[0]) };
}
function fromRC(row, col) {
  return FILES[col] + (8 - row);
}
function onBoard(r, c) { return r >= 0 && r < 8 && c >= 0 && c < 8; }
const ROOK_DIRS = [[0, 1], [0, -1], [1, 0], [-1, 0]];
const BISHOP_DIRS = [[1, 1], [1, -1], [-1, 1], [-1, -1]];
const ALL_DIRS = ROOK_DIRS.concat(BISHOP_DIRS);
const KNIGHT_JUMPS = [[1, 2], [2, 1], [-1, 2], [-2, 1], [1, -2], [2, -1], [-1, -2], [-2, -1]];
const ALL_SQUARES = [];
for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) ALL_SQUARES.push(fromRC(r, c));

function kingNeighbors(sq) {
  const { row, col } = toRC(sq);
  const set = new Set();
  for (const [dr, dc] of ALL_DIRS) {
    if (onBoard(row + dr, col + dc)) set.add(fromRC(row + dr, col + dc));
  }
  return set;
}
function knightJumps(sq) {
  const { row, col } = toRC(sq);
  const set = new Set();
  for (const [dr, dc] of KNIGHT_JUMPS) {
    if (onBoard(row + dr, col + dc)) set.add(fromRC(row + dr, col + dc));
  }
  return set;
}
function isLight(sq) {
  const { row, col } = toRC(sq);
  return (row + col) % 2 === 0;
}
function colorName(sq) { return isLight(sq) ? 'clara' : 'oscura'; }

/* Distancias en saltos de caballo desde `start`, evitando las casillas de `blocked`. */
function knightDistances(start, blocked) {
  const dist = { [start]: 0 };
  const queue = [start];
  while (queue.length) {
    const x = queue.shift();
    knightJumps(x).forEach(y => {
      if (dist[y] !== undefined || (blocked && blocked.has(y))) return;
      dist[y] = dist[x] + 1;
      queue.push(y);
    });
  }
  return dist;
}

/* Casillas atacadas por la pieza en `sq` dentro de `board` (objeto casilla → código como 'wN', 'bK'). */
function attacksFrom(board, sq) {
  const code = board[sq];
  const type = code[1];
  if (type === 'K') return kingNeighbors(sq);
  if (type === 'N') return knightJumps(sq);
  const dirs = type === 'R' ? ROOK_DIRS : type === 'B' ? BISHOP_DIRS : ALL_DIRS;
  const { row, col } = toRC(sq);
  const set = new Set();
  for (const [dr, dc] of dirs) {
    let r = row + dr, c = col + dc;
    while (onBoard(r, c)) {
      const t = fromRC(r, c);
      set.add(t);
      if (board[t]) break;
      r += dr; c += dc;
    }
  }
  return set;
}
function attackedBy(board, color) {
  const set = new Set();
  for (const sq in board) {
    if (board[sq] && board[sq][0] === color) attacksFrom(board, sq).forEach(s => set.add(s));
  }
  return set;
}
function findKing(board, color) {
  return Object.keys(board).find(sq => board[sq] === color + 'K');
}
function inCheck(board, color) {
  const k = findKing(board, color);
  return !!k && attackedBy(board, color === 'w' ? 'b' : 'w').has(k);
}
function legalMoves(board, from) {
  const color = board[from][0];
  const moves = new Set(), captures = new Set();
  attacksFrom(board, from).forEach(to => {
    if (board[to] && board[to][0] === color) return;
    const next = Object.assign({}, board);
    next[to] = next[from];
    delete next[from];
    if (inCheck(next, color)) return;
    if (board[to]) captures.add(to); else moves.add(to);
  });
  return { moves, captures };
}

/* ===== Render genérico de tablero 8x8 ===== */
const GLYPHS = { K: '&#9818;', Q: '&#9819;', R: '&#9820;', B: '&#9821;', N: '&#9822;', P: '&#9823;' };
function pieceHTML(code) {
  if (!code) return '';
  if (code === 'pawn') return `<span class="piece" style="color:#c0392b">&#9823;</span>`;
  if (code === 'star') return `<span class="piece">⭐</span>`;
  const glyph = GLYPHS[code[1]];
  if (code[0] === 'w') return `<span class="piece" style="color:#f7f7f7; -webkit-text-stroke:1.4px #2c2c3a;">${glyph}</span>`;
  return `<span class="piece" style="color:#1a1a24">${glyph}</span>`;
}
function renderBoardGrid(container, opts) {
  const pieces = opts.pieces || {};
  const highlightMoves = opts.highlightMoves || new Set();
  const highlightCaptures = opts.highlightCaptures || new Set();
  const extra = opts.extra || {};
  const labels = opts.labels || {};
  const onSquareClick = opts.onSquareClick || null;
  const clickable = opts.clickable || null;

  let html = '';
  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 8; col++) {
      const sq = fromRC(row, col);
      const classes = ['sq', (row + col) % 2 === 0 ? 'light' : 'dark'];
      if (highlightMoves.has(sq)) classes.push('reachable');
      if (highlightCaptures.has(sq)) classes.push('reachable', 'capturable');
      if (extra[sq]) classes.push(...extra[sq]);
      const isClickable = onSquareClick && (clickable ? clickable.has(sq) : (highlightMoves.has(sq) || highlightCaptures.has(sq)));
      if (isClickable) classes.push('clickable');

      let coordHTML = '';
      if (col === 0 && row === 7) coordHTML = `<span class="coord">${sq}</span>`;
      else if (col === 0) coordHTML = `<span class="coord">${8 - row}</span>`;
      else if (row === 7) coordHTML = `<span class="coord">${sq[0]}</span>`;
      const labelHTML = labels[sq] !== undefined ? `<span class="num">${labels[sq]}</span>` : '';

      html += `<div class="${classes.join(' ')}" data-sq="${sq}">${pieceHTML(pieces[sq])}${labelHTML}${coordHTML}</div>`;
    }
  }
  container.innerHTML = html;

  if (onSquareClick) {
    container.querySelectorAll('.sq.clickable').forEach(el => {
      el.addEventListener('click', () => onSquareClick(el.dataset.sq));
    });
  }
}
function addExtra(extra, sq, cls) {
  (extra[sq] = extra[sq] || []).push(cls);
}
function buildPicker(rowId, items, activeIdx, onPick) {
  const row = document.getElementById(rowId);
  if (!row) return;
  row.innerHTML = items.map((it, i) =>
    `<button class="nq-size-btn${i === activeIdx ? ' active' : ''}" data-i="${i}" style="padding:0 12px">${it.label}</button>`
  ).join('');
  row.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => onPick(parseInt(btn.dataset.i, 10)));
  });
}

/* ===== Repaso relámpago: torre, alfil, dama y rey ===== */
const REVIEW = [
  { label: '♜ Torre', code: 'wR', sq: 'c3', name: 'la torre' },
  { label: '♝ Alfil', code: 'wB', sq: 'd4', name: 'el alfil' },
  { label: '♛ Dama', code: 'wQ', sq: 'e5', name: 'la dama' },
  { label: '♚ Rey', code: 'wK', sq: 'f3', name: 'el rey' }
];
const revState = { idx: 0, found: new Set(), errors: 0, flash: null };
function revTargets() {
  const p = REVIEW[revState.idx];
  return attacksFrom({ [p.sq]: p.code }, p.sq);
}
function revRender() {
  const boardEl = document.getElementById('revBoard');
  if (!boardEl) return;
  const p = REVIEW[revState.idx];
  const targets = revTargets();
  const extra = {};
  revState.found.forEach(sq => addExtra(extra, sq, 'good'));
  if (revState.flash) addExtra(extra, revState.flash, 'bad');
  const clickable = new Set(ALL_SQUARES.filter(sq => sq !== p.sq && !revState.found.has(sq)));
  renderBoardGrid(boardEl, { pieces: { [p.sq]: p.code }, extra, clickable, onSquareClick: revClick });
  const statusEl = document.getElementById('revStatus');
  if (revState.found.size === targets.size) {
    statusEl.innerHTML = `🎉 ¡Encontraste las <strong>${targets.size}</strong> casillas de ${p.name}! Errores: <strong>${revState.errors}</strong>. Prueba con otra pieza.`;
  } else {
    statusEl.innerHTML = `Encontradas: <strong>${revState.found.size}/${targets.size}</strong> &nbsp;|&nbsp; Errores: <strong>${revState.errors}</strong>`;
  }
}
function revClick(sq) {
  const targets = revTargets();
  if (revState.found.size === targets.size) return;
  if (targets.has(sq)) {
    revState.found.add(sq);
  } else {
    revState.errors++;
    revState.flash = sq;
    setTimeout(() => { if (revState.flash === sq) { revState.flash = null; revRender(); } }, 600);
  }
  revRender();
}
function revPick(i) {
  revState.idx = i;
  revState.found = new Set();
  revState.errors = 0;
  revState.flash = null;
  buildPicker('revPieces', REVIEW, revState.idx, revPick);
  revRender();
}
if (document.getElementById('revBoard')) {
  revPick(0);
  document.getElementById('revReset').addEventListener('click', () => revPick(revState.idx));
}

/* ===== Diagrama: movimiento del caballo ===== */
const nMoveEl = document.getElementById('nMoveBoard');
/* Cada dirección: avance recto de dos casillas [dr, dc] y los dos giros posibles al final. */
const L_DIRS = [
  { label: '⬆️ Arriba', color: '#4a6fdc', step: [-1, 0], turns: [[0, -1], [0, 1]] },
  { label: '➡️ Derecha', color: '#e08b25', step: [0, 1], turns: [[-1, 0], [1, 0]] },
  { label: '⬇️ Abajo', color: '#8e5fd6', step: [1, 0], turns: [[0, -1], [0, 1]] },
  { label: '⬅️ Izquierda', color: '#d6336c', step: [0, -1], turns: [[-1, 0], [1, 0]] }
];
const MOVE_PICKS = [{ label: '✨ Todas' }].concat(L_DIRS);
let movePick = 0;
function arrowSVG(x1, y1, x2, y2, color, id, trimStart, trimEnd) {
  const len = Math.hypot(x2 - x1, y2 - y1);
  const ux = (x2 - x1) / len, uy = (y2 - y1) / len;
  const sx = x1 + ux * trimStart, sy = y1 + uy * trimStart;
  const ex = x2 - ux * trimEnd, ey = y2 - uy * trimEnd;
  return `<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="${color}" stroke-width="0.13" stroke-linecap="round" marker-end="url(#${id})"/>`;
}
function moveRender() {
  const origin = 'd4';
  const { row, col } = toRC(origin);
  const shown = movePick === 0 ? L_DIRS : [L_DIRS[movePick - 1]];
  const dots = new Set();
  shown.forEach(d => d.turns.forEach(([tr, tc]) => {
    dots.add(fromRC(row + 2 * d.step[0] + tr, col + 2 * d.step[1] + tc));
  }));
  renderBoardGrid(nMoveEl, { pieces: { [origin]: 'wN' }, highlightMoves: dots });
  let defs = '', lines = '';
  shown.forEach((d, i) => {
    const id = 'lArrow' + i;
    defs += `<marker id="${id}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="${d.color}"/></marker>`;
    const cx = col + 0.5, cy = row + 0.5;
    const kx = cx + 2 * d.step[1], ky = cy + 2 * d.step[0];
    lines += arrowSVG(cx, cy, kx, ky, d.color, id, 0.38, 0.12);
    d.turns.forEach(([tr, tc]) => {
      lines += arrowSVG(kx, ky, kx + tc, ky + tr, d.color, id, 0.05, 0.3);
    });
  });
  nMoveEl.insertAdjacentHTML('beforeend',
    `<svg class="arrow-layer" viewBox="0 0 8 8" aria-hidden="true"><defs>${defs}</defs>${lines}</svg>`);
  buildPicker('nMovePick', MOVE_PICKS, movePick, (i) => { movePick = i; moveRender(); });
}
if (nMoveEl) moveRender();

  'abcdefgh'.split('').forEach(f => { pieces[f + '2'] = 'wP'; });
  const moves = new Set();
  ['b1', 'g1'].forEach(sq => legalMoves(pieces, sq).moves.forEach(m => moves.add(m)));
  renderBoardGrid(nJumpEl, { pieces, highlightMoves: moves });
}

/* ===== ¿Cuántos saltos tiene? ===== */
const edgeState = { knight: 'd4', showAll: false };
function edgeRender() {
  const boardEl = document.getElementById('nEdgeBoard');
  if (!boardEl) return;
  const moves = knightJumps(edgeState.knight);
  const labels = {};
  const extra = {};
  if (edgeState.showAll) {
    ALL_SQUARES.forEach(sq => {
      const n = knightJumps(sq).size;
      if (sq !== edgeState.knight) labels[sq] = n;
      addExtra(extra, sq, 'heat' + n);
    });
  }
  renderBoardGrid(boardEl, {
    pieces: { [edgeState.knight]: 'wN' },
    highlightMoves: edgeState.showAll ? new Set() : moves,
    extra,
    labels,
    clickable: new Set(ALL_SQUARES.filter(sq => sq !== edgeState.knight)),
    onSquareClick: (sq) => { edgeState.knight = sq; edgeRender(); }
  });
  const n = moves.size;
  const kind = n === 8 ? 'el centro' : n === 2 ? 'una esquina' : n === 3 ? 'junto a una esquina' : n === 4 ? 'la orilla' : 'cerca de la orilla';
  document.getElementById('nEdgeStatus').innerHTML =

/* ===== Ejercicio: ¿se puede en exactamente N saltos? ===== */
/* Busca un camino de exactamente `n` saltos de `from` a `to`; devuelve la lista de casillas o null. */
function knightWalk(from, to, n) {
  let layer = { [from]: null };
  const layers = [layer];
  for (let k = 1; k <= n; k++) {
    const next = {};
    Object.keys(layer).forEach(x => {
      knightJumps(x).forEach(y => { if (!(y in next)) next[y] = x; });
    });
    layers.push(next);
    layer = next;
  }
  if (!(to in layers[n])) return null;
  const path = [to];
  let cur = to;
  for (let k = n; k >= 1; k--) {
    cur = layers[k][cur];
    path.unshift(cur);
  }
  return path;
}
const PARITY_QUIZ = [
  { from: 'g1', to: 'f3', n: 1 },
  { from: 'b1', to: 'b1', n: 2 },
  { from: 'b1', to: 'b1', n: 3 },
  { from: 'a1', to: 'h8', n: 5 },
  { from: 'a1', to: 'h8', n: 6 },
  { from: 'a1', to: 'b2', n: 2 },
  { from: 'e4', to: 'e5', n: 3 },
  { from: 'd4', to: 'd5', n: 2 }
];
const parityState = { idx: 0, answered: false, correct: 0, done: false };
function parityRender() {
  const boardEl = document.getElementById('nParityBoard');
  if (!boardEl) return;
  const statusEl = document.getElementById('nParityStatus');
  const yesB = document.getElementById('nParityYes');
  const noB = document.getElementById('nParityNo');
  const nextB = document.getElementById('nParityNext');
  if (parityState.done) {
    renderBoardGrid(boardEl, { pieces: { e4: 'wN' } });
    statusEl.innerHTML = `🏁 ¡Terminaste! Acertaste <strong>${parityState.correct}</strong> de <strong>${PARITY_QUIZ.length}</strong>. Toca "Reiniciar" para volver a jugar.`;
    yesB.disabled = noB.disabled = nextB.disabled = true;
    return;
  }
  const q = PARITY_QUIZ[parityState.idx];
  const pieces = {};
  if (q.to !== q.from) pieces[q.to] = 'star';
  pieces[q.from] = 'wN';
  const extra = {};
  addExtra(extra, q.to, 'goal');
  const labels = {};
  if (parityState.answered) {
    const path = knightWalk(q.from, q.to, q.n);
    if (path) path.slice(1).forEach((sq, i) => {
      labels[sq] = labels[sq] !== undefined ? `${labels[sq]},${i + 1}` : i + 1;
      addExtra(extra, sq, 'visited');
    });
  }
  renderBoardGrid(boardEl, { pieces, extra, labels });
  yesB.disabled = noB.disabled = parityState.answered;
  nextB.disabled = !parityState.answered;
  if (!parityState.answered) {
    const goal = q.to === q.from ? `volver a <strong>${q.from}</strong>` : `ir de <strong>${q.from}</strong> a <strong>${q.to}</strong>`;
    statusEl.innerHTML = `Pregunta <strong>${parityState.idx + 1}/${PARITY_QUIZ.length}</strong> &nbsp;|&nbsp; Aciertos: <strong>${parityState.correct}</strong><br>¿Puede el caballo ${goal} en exactamente <strong>${q.n}</strong> ${q.n === 1 ? 'salto' : 'saltos'}?`;
  }
}
function parityAnswer(saysYes) {
  if (parityState.answered || parityState.done) return;
  const q = PARITY_QUIZ[parityState.idx];
  const path = knightWalk(q.from, q.to, q.n);
  const possible = !!path;
  const ok = saysYes === possible;
  if (ok) parityState.correct++;
  parityState.answered = true;
  parityRender();
  let why;
  if (possible) {
    why = `Sí se puede. Por ejemplo: ${path.join(' → ')}.`;
  } else if ((q.n % 2 === 0) !== (isLight(q.from) === isLight(q.to))) {
    const endsOn = q.n % 2 === 0 ? colorName(q.from) : (isLight(q.from) ? 'oscura' : 'clara');
    why = `No se puede: sale de una casilla ${colorName(q.from)} y con ${q.n} saltos (${q.n % 2 === 0 ? 'par' : 'impar'}) termina en una casilla ${endsOn}, pero ${q.to} es ${colorName(q.to)}.`;
  } else {
    const d = knightDistances(q.from)[q.to];
    why = `No se puede. Los colores sí cuadran, pero el caballo necesita al menos <strong>${d}</strong> saltos para llegar.`;
  }
  document.getElementById('nParityStatus').innerHTML = `${ok ? '✅ ¡Correcto!' : '❌ ¡Casi!'} ${why}`;
}
if (document.getElementById('nParityBoard')) {
  document.getElementById('nParityYes').addEventListener('click', () => parityAnswer(true));
  document.getElementById('nParityNo').addEventListener('click', () => parityAnswer(false));
  document.getElementById('nParityNext').addEventListener('click', () => {
    if (!parityState.answered) return;
    parityState.answered = false;
    parityState.idx++;
    if (parityState.idx >= PARITY_QUIZ.length) parityState.done = true;
    parityRender();
  });
  document.getElementById('nParityReset').addEventListener('click', () => {
    Object.assign(parityState, { idx: 0, answered: false, correct: 0, done: false });
    parityRender();
  });
  parityRender();
}

/* ===== Ejercicios: el Caballo hambriento ===== */
/* Menor número de saltos para capturar todos los peones (búsqueda en anchura sobre posición + peones restantes). */
function hungryOptimal(start, pawns) {
  const idx = {};
  pawns.forEach((p, i) => { idx[p] = i; });
  const full = (1 << pawns.length) - 1;
  const key = (sq, mask) => sq + '|' + mask;
  const seen = new Set([key(start, full)]);
  let frontier = [[start, full]];
  let steps = 0;
  while (frontier.length) {
    const next = [];
    for (const [sq, mask] of frontier) {
      if (mask === 0) return steps;
      knightJumps(sq).forEach(y => {
        const m = idx[y] !== undefined ? mask & ~(1 << idx[y]) : mask;
        const k = key(y, m);
        if (!seen.has(k)) { seen.add(k); next.push([y, m]); }
      });
    }
    frontier = next;
    steps++;
  }
  return null;
}
class KnightPuzzle {
  constructor(boardId, { start, pawns, statusId }) {
    this.boardEl = document.getElementById(boardId);
    this.statusEl = statusId ? document.getElementById(statusId) : null;
    this.start = start;
    this.initialPawns = pawns.slice();
    this.optimal = hungryOptimal(start, pawns);
    this.reset();
  }
  reset() {
    this.knight = this.start;
    this.pawns = new Set(this.initialPawns);
    this.moves = 0;
    this.finished = false;
    this.render();
  }
  handleClick(sq) {
    if (this.finished) return;
    if (this.pawns.has(sq)) this.pawns.delete(sq);
    this.knight = sq;
    this.moves++;
    if (this.pawns.size === 0) this.finished = true;
    this.render();
  }
  render() {
    const moves = new Set(), captures = new Set();
    knightJumps(this.knight).forEach(sq => (this.pawns.has(sq) ? captures : moves).add(sq));
    const pieces = { [this.knight]: 'wN' };
    this.pawns.forEach(p => { pieces[p] = 'pawn'; });
    renderBoardGrid(this.boardEl, {
      pieces,
      highlightMoves: this.finished ? new Set() : moves,
      highlightCaptures: this.finished ? new Set() : captures,
      onSquareClick: this.finished ? null : (sq) => this.handleClick(sq)
    });
    if (!this.statusEl) return;
    if (this.finished) {
      this.statusEl.innerHTML = this.moves <= this.optimal
        ? `🎉 ¡Lo lograste en <strong>${this.moves}</strong> saltos — el camino más corto posible!`
        : `✅ ¡Capturaste todos los peones en <strong>${this.moves}</strong> saltos! El reto es lograrlo en solo <strong>${this.optimal}</strong>. Toca "Reiniciar" e inténtalo de nuevo.`;
    } else {
      this.statusEl.innerHTML = `Saltos: <strong>${this.moves}</strong> &nbsp;|&nbsp; Peones restantes: <strong>${this.pawns.size}</strong> &nbsp;|&nbsp; Reto: lograrlo en <strong>${this.optimal}</strong>`;
    }
  }
}
function setupKnightPuzzle(n, cfg) {
  if (!document.getElementById(`nPuzzle${n}Board`)) return;

/* ===== Ejercicio: encuentra el tenedor ===== */
const FORKS = [
  { label: 'Tenedor 1', board: { b5: 'wN', e8: 'bK', a8: 'bQ', g1: 'wK' } },
  { label: 'Tenedor 2', board: { d5: 'wN', g8: 'bK', c8: 'bR', h1: 'wK' } },
  { label: 'Tenedor 3', board: { f5: 'wN', c8: 'bK', e4: 'bQ', g1: 'wK' } }
];
const PIECE_NAMES = { K: 'al rey', Q: 'a la dama', R: 'a la torre', B: 'al alfil' };
const forkState = { idx: 0, board: null, selected: null, lock: false, msg: null, tries: 0, solved: false, hits: [] };
function forkLoad(keepTries) {
  forkState.board = Object.assign({}, FORKS[forkState.idx].board);
  forkState.selected = null;
  forkState.lock = false;
  forkState.solved = false;
  forkState.hits = [];
  if (!keepTries) { forkState.tries = 0; forkState.msg = null; }
  forkRender();
}
function forkRender() {
  const boardEl = document.getElementById('nForkBoard');
  if (!boardEl) return;
  const board = forkState.board;
  const knightSq = Object.keys(board).find(sq => board[sq] === 'wN');
  const extra = {};
  let moves = new Set(), captures = new Set();
  if (!forkState.lock && forkState.selected) {
    addExtra(extra, forkState.selected, 'selected');
    ({ moves, captures } = legalMoves(board, forkState.selected));
  }
  forkState.hits.forEach(sq => addExtra(extra, sq, board[sq] && board[sq][1] === 'K' ? 'incheck' : 'forked'));
  const clickable = new Set();
  if (!forkState.lock) {
    clickable.add(knightSq);
    moves.forEach(s => clickable.add(s));
    captures.forEach(s => clickable.add(s));
  }
  renderBoardGrid(boardEl, { pieces: board, highlightMoves: moves, highlightCaptures: captures, extra, clickable, onSquareClick: forkClick });
  document.getElementById('nForkStatus').innerHTML = forkState.msg ||
    `Juegan las blancas &nbsp;|&nbsp; Intentos: <strong>${forkState.tries}</strong> &nbsp;|&nbsp; Toca al caballo blanco.`;
}
function forkClick(sq) {
  if (forkState.lock) return;
  const board = forkState.board;
  if (board[sq] === 'wN') {
    forkState.selected = forkState.selected === sq ? null : sq;
    forkState.msg = null;
    forkRender();
    return;
  }
  if (!forkState.selected) return;
  const from = forkState.selected;
  const { moves, captures } = legalMoves(board, from);
  if (!moves.has(sq) && !captures.has(sq)) return;
  board[sq] = board[from];
  delete board[from];
  forkState.selected = null;
  forkState.tries++;
  forkState.lock = true;
  const hits = [...knightJumps(sq)].filter(t => board[t] && board[t][0] === 'b' && 'KQR'.includes(board[t][1]));
  const safe = !attackedBy(board, 'b').has(sq);
  forkState.hits = hits;
  if (hits.length >= 2 && safe) {
    forkState.solved = true;
    const names = hits.map(t => PIECE_NAMES[board[t][1]]).join(' y ');
    forkState.msg = `🎉 ¡TENEDOR! El caballo en <strong>${sq}</strong> ataca ${names} al mismo tiempo. Prueba el siguiente reto.`;
    forkRender();
    return;
  }
  forkState.msg = !safe
    ? `😬 ¡Cuidado! En ${sq} el caballo ataca, pero las negras lo pueden capturar. Busca una casilla segura.`
    : hits.length === 1
      ? `👀 Desde ${sq} el caballo ataca solo ${PIECE_NAMES[board[hits[0]][1]]}. ¡Un tenedor ataca a dos piezas!`
      : `🤔 Desde ${sq} el caballo no ataca a ninguna pieza importante. ¡Inténtalo de nuevo!`;
  forkRender();
  setTimeout(() => {
    const tries = forkState.tries, msg = forkState.msg;
    forkLoad(true);
    forkState.tries = tries;
    forkState.msg = msg;
    forkRender();
  }, 2200);
}
function forkPick(i) {
  forkState.idx = i;
  buildPicker('nForkPick', FORKS, forkState.idx, forkPick);
  forkLoad(false);
}

/* ===== Reto final: el recorrido del caballo (tableros de n×n) ===== */
const TOUR_SIZES = [{ label: '5×5', n: 5 }, { label: '6×6', n: 6 }, { label: '8×8', n: 8 }];
const tourState = { sizeIdx: 0, path: [], hint: null };
function tourN() { return TOUR_SIZES[tourState.sizeIdx].n; }
function tourJumps(cell) {
  const n = tourN();
  const r = Math.floor(cell / n), c = cell % n;
  const out = [];
  for (const [dr, dc] of KNIGHT_JUMPS) {
    const rr = r + dr, cc = c + dc;
    if (rr >= 0 && rr < n && cc >= 0 && cc < n) out.push(rr * n + cc);
  }
  return out;
}
function tourFree(cell) {
  return tourJumps(cell).filter(x => !tourState.path.includes(x));
}
function tourOptions() {
  if (tourState.path.length === 0) return [];
  return tourFree(tourState.path[tourState.path.length - 1]);
}
function tourRender() {
  const boardEl = document.getElementById('nTourBoard');
  if (!boardEl) return;
  const n = tourN();
  boardEl.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
  boardEl.style.gridTemplateRows = `repeat(${n}, 1fr)`;
  const total = n * n;
  const options = tourOptions();
  const last = tourState.path[tourState.path.length - 1];
  let html = '';
  for (let cell = 0; cell < total; cell++) {
    const r = Math.floor(cell / n), c = cell % n;
    const classes = ['sq', (r + c) % 2 === 0 ? 'light' : 'dark'];
    const step = tourState.path.indexOf(cell);
    let inner = '';
    if (cell === last) {
      inner = pieceHTML('wN') + `<span class="num tour-step">${step + 1}</span>`;
    } else if (step >= 0) {
      classes.push('visited');
      inner = `<span class="num">${step + 1}</span>`;
    }
    const isOption = tourState.path.length === 0 || options.includes(cell);
    if (isOption) classes.push('clickable');
    if (tourState.path.length > 0 && options.includes(cell)) classes.push('reachable');
    if (tourState.hint === cell) classes.push('hint');
    html += `<div class="${classes.join(' ')}" data-cell="${cell}">${inner}</div>`;
  }
  boardEl.innerHTML = html;
  boardEl.querySelectorAll('.sq.clickable').forEach(el => {
    el.addEventListener('click', () => {
      tourState.path.push(parseInt(el.dataset.cell, 10));
      tourState.hint = null;
      tourRender();
    });
  });
  const statusEl = document.getElementById('nTourStatus');
  const k = tourState.path.length;
  if (k === 0) {
    statusEl.innerHTML = `Tablero de <strong>${n}×${n}</strong> (${total} casillas). Toca la casilla donde quieres empezar.`;
  } else if (k === total) {
    statusEl.innerHTML = `🏆 ¡INCREÍBLE! El caballo visitó las <strong>${total}</strong> casillas sin repetir ninguna. ¡Completaste el recorrido del caballo!`;
  } else if (options.length === 0) {
    statusEl.innerHTML = `😱 ¡Sin salida! Visitaste <strong>${k}</strong> de <strong>${total}</strong> casillas. Usa "Deshacer" o "Reiniciar" y prueba otra ruta.`;
  } else {
    statusEl.innerHTML = `Casillas visitadas: <strong>${k}/${total}</strong> &nbsp;|&nbsp; Saltos posibles: <strong>${options.length}</strong>`;
  }
}
function tourHint() {
  const options = tourOptions();
  if (options.length === 0) return;
  let best = options[0], bestCount = Infinity;
  options.forEach(cell => {
    const onward = tourJumps(cell).filter(x => x !== cell && !tourState.path.includes(x)).length;
    if (onward < bestCount) { best = cell; bestCount = onward; }
  });
  tourState.hint = best;
  tourRender();
}
function tourPick(i) {
  tourState.sizeIdx = i;
  tourState.path = [];
  tourState.hint = null;
  buildPicker('nTourPick', TOUR_SIZES, tourState.sizeIdx, tourPick);
  tourRender();
}
if (document.getElementById('nTourBoard')) {
  tourPick(0);
  document.getElementById('nTourHint').addEventListener('click', tourHint);
  document.getElementById('nTourUndo').addEventListener('click', () => {
    tourState.path.pop();
    tourState.hint = null;
    tourRender();
  });
  document.getElementById('nTourReset').addEventListener('click', () => tourPick(tourState.sizeIdx));
}
</script>
</body>
</html>
